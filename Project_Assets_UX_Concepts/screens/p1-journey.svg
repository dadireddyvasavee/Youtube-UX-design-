<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 574" width="1130" height="574" role="img"><rect x="0" y="0" width="1130" height="574" rx="0" fill="#FFFFFF"/><rect x="0" y="0" width="1130" height="574" rx="0" fill="#fff"/><text x="32" y="40" font-family="Roboto, Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F0F0F" text-anchor="start">Project 1 · Journey map (proto-persona, hypothesis)</text><text x="32" y="62" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#555" text-anchor="start">Based on assumptions and publicly observable behaviour, not on interviews. To be validated in the research plan.</text><text x="32" y="86" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#065FD4" text-anchor="start">Persona: Ananya, 20, engineering student, 35-minute commute, mobile-first</text><rect x="150" y="100" width="185.2" height="34" rx="6" fill="#202124"/><text x="242.6" y="122" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Decide</text><rect x="341.2" y="100" width="185.2" height="34" rx="6" fill="#202124"/><text x="433.79999999999995" y="122" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Browse</text><rect x="532.4" y="100" width="185.2" height="34" rx="6" fill="#202124"/><text x="625" y="122" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Watch</text><rect x="723.5999999999999" y="100" width="185.2" height="34" rx="6" fill="#202124"/><text x="816.1999999999999" y="122" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Save for later</text><rect x="914.8" y="100" width="185.2" height="34" rx="6" fill="#202124"/><text x="1007.4" y="122" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Return</text><rect x="24" y="144" width="1094" height="58" rx="8" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1"/><text x="36" y="174" font-family="Roboto, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0F" text-anchor="start">Actions</text><text x="156" y="164" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Opens app on the bus with</text><text x="156" y="178.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">~30 min to spare</text><text x="347.2" y="164" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Scrolls feed; taps chips;</text><text x="347.2" y="178.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">unsure what fits</text><text x="538.4" y="164" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Opens a 12-min explainer;</text><text x="538.4" y="178.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">searches for the chapter</text><text x="538.4" y="193" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">she needs</text><text x="729.5999999999999" y="164" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Taps Save; video joins a</text><text x="729.5999999999999" y="178.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">long Watch later list</text><text x="920.8" y="164" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Next day opens app; wants</text><text x="920.8" y="178.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">to resume</text><rect x="24" y="208" width="1094" height="66" rx="8" fill="#fff" stroke="#E0E0E0" stroke-width="1"/><text x="36" y="242" font-family="Roboto, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0F" text-anchor="start">Thoughts</text><text x="156" y="228" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">“I only have half an hour.”</text><text x="347.2" y="228" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">“Is this one too long?”</text><text x="538.4" y="228" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">“Where’s the part about</text><text x="538.4" y="242.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">resizing?”</text><text x="729.5999999999999" y="228" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">“I’ll watch these later.”</text><text x="920.8" y="228" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">“What was I watching?”</text><rect x="24" y="280" width="1094" height="114" rx="8" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1"/><text x="36" y="338" font-family="Roboto, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0F" text-anchor="start">Emotion</text><line x1="150" y1="340" x2="1106" y2="340" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4 4"/><path d="M242.6 340 L433.79999999999995 358 L625 322 L816.1999999999999 322 L1007.4 358" fill="none" stroke="#0072B2" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="242.6" cy="340" r="6.5" fill="#fff" stroke="#0072B2" stroke-width="2.5"/><text x="242.6" y="328" font-family="Roboto, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#555" text-anchor="middle">Neutral</text><circle cx="433.79999999999995" cy="358" r="6.5" fill="#fff" stroke="#0072B2" stroke-width="2.5"/><text x="433.79999999999995" y="378" font-family="Roboto, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#555" text-anchor="middle">Frustrated</text><circle cx="625" cy="322" r="6.5" fill="#fff" stroke="#0072B2" stroke-width="2.5"/><text x="625" y="310" font-family="Roboto, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#555" text-anchor="middle">Positive</text><circle cx="816.1999999999999" cy="322" r="6.5" fill="#fff" stroke="#0072B2" stroke-width="2.5"/><text x="816.1999999999999" y="310" font-family="Roboto, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#555" text-anchor="middle">Positive</text><circle cx="1007.4" cy="358" r="6.5" fill="#fff" stroke="#0072B2" stroke-width="2.5"/><text x="1007.4" y="378" font-family="Roboto, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#555" text-anchor="middle">Frustrated</text><rect x="24" y="400" width="1094" height="78" rx="8" fill="#fff" stroke="#E0E0E0" stroke-width="1"/><text x="36" y="440" font-family="Roboto, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0F" text-anchor="start">Pain points</text><text x="156" y="420" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">No way to state available</text><text x="156" y="434.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">time</text><text x="347.2" y="420" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Duration is only visible</text><text x="347.2" y="434.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">per card; no total</text><text x="538.4" y="420" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Chapters and speed take</text><text x="538.4" y="434.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">several taps one-handed</text><text x="729.5999999999999" y="420" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Saved list grows with no</text><text x="729.5999999999999" y="434.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">sense of time</text><text x="920.8" y="420" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Resuming relies on</text><text x="920.8" y="434.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">remembering the title</text><rect x="24" y="484" width="1094" height="78" rx="8" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1"/><text x="36" y="524" font-family="Roboto, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0F" text-anchor="start">Opportunities</text><text x="156" y="504" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">“I have” time bar</text><text x="347.2" y="504" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">Feed re-ranked to fit time</text><text x="538.4" y="504" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">Reachable control row +</text><text x="538.4" y="518.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">chapters strip</text><text x="729.5999999999999" y="504" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">Queue shows total time; Fit</text><text x="729.5999999999999" y="518.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">to my time</text><text x="920.8" y="504" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">Continue watching shelf on</text><text x="920.8" y="518.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">Home</text></svg>