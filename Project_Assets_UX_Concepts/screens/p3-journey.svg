<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 574" width="1130" height="574" role="img"><rect x="0" y="0" width="1130" height="574" rx="0" fill="#FFFFFF"/><rect x="0" y="0" width="1130" height="574" rx="0" fill="#fff"/><text x="32" y="40" font-family="Roboto, Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F0F0F" text-anchor="start">Project 3 · Journey map (proto-persona, hypothesis)</text><text x="32" y="62" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#555" text-anchor="start">Based on published accessibility guidance and assumptions, not on interviews. Must be validated with disabled participants.</text><text x="32" y="86" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#065FD4" text-anchor="start">Persona: Meera, 22, deaf, relies on captions and transcripts to study</text><rect x="150" y="100" width="185.2" height="34" rx="6" fill="#202124"/><text x="242.6" y="122" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Search</text><rect x="341.2" y="100" width="185.2" height="34" rx="6" fill="#202124"/><text x="433.79999999999995" y="122" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Scan results</text><rect x="532.4" y="100" width="185.2" height="34" rx="6" fill="#202124"/><text x="625" y="122" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Check access</text><rect x="723.5999999999999" y="100" width="185.2" height="34" rx="6" fill="#202124"/><text x="816.1999999999999" y="122" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Watch &amp; find</text><rect x="914.8" y="100" width="185.2" height="34" rx="6" fill="#202124"/><text x="1007.4" y="122" font-family="Roboto, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Reuse</text><rect x="24" y="144" width="1094" height="58" rx="8" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1"/><text x="36" y="174" font-family="Roboto, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0F" text-anchor="start">Actions</text><text x="156" y="164" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Searches a topic</text><text x="347.2" y="164" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Scans results for any that</text><text x="347.2" y="178.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">have captions</text><text x="538.4" y="164" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Opens several to check</text><text x="538.4" y="178.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">caption quality</text><text x="729.5999999999999" y="164" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Plays; scrubs to find one</text><text x="729.5999999999999" y="178.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">concept</text><text x="920.8" y="164" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Wants the same settings</text><text x="920.8" y="178.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">next time</text><rect x="24" y="208" width="1094" height="66" rx="8" fill="#fff" stroke="#E0E0E0" stroke-width="1"/><text x="36" y="242" font-family="Roboto, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0F" text-anchor="start">Thoughts</text><text x="156" y="228" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">“Hope this one is</text><text x="156" y="242.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">captioned.”</text><text x="347.2" y="228" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">“Which have usable</text><text x="347.2" y="242.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">captions?”</text><text x="538.4" y="228" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">“These auto captions are</text><text x="538.4" y="242.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">wrong.”</text><text x="729.5999999999999" y="228" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">“I need the part about</text><text x="729.5999999999999" y="242.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">queues.”</text><text x="920.8" y="228" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start" font-style="italic">“I set this up yesterday.”</text><rect x="24" y="280" width="1094" height="114" rx="8" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1"/><text x="36" y="338" font-family="Roboto, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0F" text-anchor="start">Emotion</text><line x1="150" y1="340" x2="1106" y2="340" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4 4"/><path d="M242.6 340 L433.79999999999995 358 L625 358 L816.1999999999999 322 L1007.4 340" fill="none" stroke="#0072B2" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="242.6" cy="340" r="6.5" fill="#fff" stroke="#0072B2" stroke-width="2.5"/><text x="242.6" y="328" font-family="Roboto, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#555" text-anchor="middle">Neutral</text><circle cx="433.79999999999995" cy="358" r="6.5" fill="#fff" stroke="#0072B2" stroke-width="2.5"/><text x="433.79999999999995" y="378" font-family="Roboto, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#555" text-anchor="middle">Frustrated</text><circle cx="625" cy="358" r="6.5" fill="#fff" stroke="#0072B2" stroke-width="2.5"/><text x="625" y="378" font-family="Roboto, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#555" text-anchor="middle">Frustrated</text><circle cx="816.1999999999999" cy="322" r="6.5" fill="#fff" stroke="#0072B2" stroke-width="2.5"/><text x="816.1999999999999" y="310" font-family="Roboto, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#555" text-anchor="middle">Positive</text><circle cx="1007.4" cy="340" r="6.5" fill="#fff" stroke="#0072B2" stroke-width="2.5"/><text x="1007.4" y="328" font-family="Roboto, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#555" text-anchor="middle">Neutral</text><rect x="24" y="400" width="1094" height="78" rx="8" fill="#fff" stroke="#E0E0E0" stroke-width="1"/><text x="36" y="440" font-family="Roboto, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0F" text-anchor="start">Pain points</text><text x="156" y="420" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Captions not a search</text><text x="156" y="434.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">criterion</text><text x="347.2" y="420" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Access info hidden until</text><text x="347.2" y="434.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">you open the video</text><text x="538.4" y="420" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Caption quality unknown</text><text x="538.4" y="434.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">before playing</text><text x="729.5999999999999" y="420" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Transcript is hard to</text><text x="729.5999999999999" y="434.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">search or jump from</text><text x="920.8" y="420" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">Preferences not remembered</text><text x="920.8" y="434.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F0F0F" text-anchor="start">across surfaces</text><rect x="24" y="484" width="1094" height="78" rx="8" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1"/><text x="36" y="524" font-family="Roboto, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F0F0F" text-anchor="start">Opportunities</text><text x="156" y="504" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">Access filters + chips</text><text x="347.2" y="504" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">Text-labelled badges on</text><text x="347.2" y="518.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">every result</text><text x="538.4" y="504" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">“Auto captions only”</text><text x="538.4" y="518.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">warning label</text><text x="729.5999999999999" y="504" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">Searchable transcript with</text><text x="729.5999999999999" y="518.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">timestamps</text><text x="920.8" y="504" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">“Save as my defaults”</text><text x="920.8" y="518.5" font-family="Roboto, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B6B37" text-anchor="start">everywhere</text></svg>